<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Tasks · ' + ${stack}">Tasks</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 small { font-size: .5em; color: #888; font-weight: normal; }
    form.add { display: flex; gap: 8px; margin-bottom: 20px; }
    form.add input { flex: 1; padding: 8px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #999; }
    button { cursor: pointer; padding: 6px 10px; }
    form { margin: 0; }
  </style>
</head>
<body>
  <h1>Tasks <small th:text="${stack}">Spring</small></h1>

  <form class="add" method="post" th:action="@{/add}">
    <input name="title" placeholder="What needs doing?" required autofocus>
    <button type="submit">Add</button>
  </form>

  <ul>
    <li th:each="t : ${tasks}" th:classappend="${t.done} ? 'done'">
      <form method="post" th:action="@{/toggle/{id}(id=${t.id})}">
        <button type="submit" th:text="${t.done} ? '↺' : '✓'">✓</button>
      </form>
      <span th:text="${t.title}">title</span>
      <form method="post" th:action="@{/delete/{id}(id=${t.id})}">
        <button type="submit">Delete</button>
      </form>
    </li>
    <li th:if="${#lists.isEmpty(tasks)}"><em>No tasks yet.</em></li>
  </ul>
</body>
</html>
